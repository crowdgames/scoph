[package]
name = "scoph"
version = "0.1.0"
edition = "2024"
description = "An implementation of the TRRBT language for use across multiple projects"

[dependencies]
anyhow = "1.0.104"
derive_more = { version = "2.1.1", features = ["debug"] }
petgraph = { version = "0.8.3", features = ["serde-1"] }
pretty_assertions = "1.4.1"
rand = "0.10.3"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_with = "3.23.0"
strum = { version = "0.28.0", features = ["derive"] }
thiserror = "2.0.21"
toodee = "0.6.1"
