[package]
name = "scoph-tui"
version = "0.1.0"
edition = "2024"
description = "A terminal interface and REPL for running TRRBT games"

[dependencies]
anyhow = "1.0.104"
ascii-petgraph = "0.2.0"
clap = { version = "4.6.7", features = ["derive", "error-context"] }
crossterm = "0.29.0"
ratatui = "0.30.2"
scoph = { version = "0.1.0", path = "../scoph" }
shellwords = "1.1.0"
tui-prompts = "0.6.8"
