[package]
name = "scoph-ffi"
version = "0.1.0"
edition = "2024"
description = "A C library to use scoph on any platform"

[lib]
name = "scoph"
crate-type = ["staticlib"]
doc = false

[dependencies]
scoph = { path = "../scoph", default-features = false }
libc_alloc = "1"

[features]
std = ["scoph/std"]
default = ["std"]
